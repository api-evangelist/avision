aid: avision
name: Avision
description: >-
  Avision is airspace infrastructure for drone and Advanced Air Mobility operations.
  The platform delivers FAA airspace services — LAANC flight authorizations, B4UFLY
  airspace awareness, TFRs, NOTAMs, and advisory information — alongside UTM / U-space
  coordination and prioritization for safely integrating uncrewed aircraft into national
  airspace. Avision serves commercial Part 107 pilots, recreational (Section 44809)
  flyers, public-safety and first-responder agencies, airports, and critical-infrastructure
  operators through web and mobile apps, with a flexible REST API integration offered
  to enterprise customers and drone manufacturers. The company holds an FAA LOA for
  BVLOS operations and has completed a UTM production rollout in Switzerland.
